<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Document</title>
    <style>
        #myContainer {
        width: 400px;
        height: 400px;
        position: relative;
        background: yellow;
        }
        #redSq {
        width: 50px;
        height: 50px;
        position: absolute;
        background-color: red;
        }

        #blueSq {
        width: 50px;
        height: 50px;
        top: 350px;
        left: 350px;
        position: absolute;
        background-color: blue;
        }

        .square {
            position: absolute;
            width: 50px;
            height: 50px;
        }

    </style>
</head>
<body>
    <h1 style="text-align: center;">Welcome the Technical part of my homework 4</h1>

    <label for="redSpeed">Red square speed</label>
        <select id="redSpeed">
            <option value=30>Slow</option>
            <option value=20>Medium</option>
            <option value=10>Fast</option>
        </select>
        <button id="moveRedBtn">Move red square</button> <br><br> 
        
        <label for="blueSpeed">Blue square speed</label>
        <select id="blueSpeed">
            <option value=30>Slow</option>
            <option value=20>Medium</option>
            <option value=10>Fast</option>
        </select>
        <button id="moveBlueBtn">Move blue square</button> <br><br>  
        
        <div id ="myContainer">
            <div id ="blueSq"></div>
            <div id ="redSq"></div>
            
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>

        <button id="startButton">Start Animation</button>

        <script src="js/hw4animation.js"></script>
    </body>
</html>
