<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <title>Animation Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>This is The Creative Part of HW5</h1>
    <canvas id="canvas1" width="400" height="300"></canvas>
    <div class="controls">
        <button id="startBtn">Start Animation</button>
        <button id="stopBtn">Stop Animation</button>
    </div>
    <div class="container">
        <h2 style="text-align: center;">Resources</h2>
        <div class="inner-container">
            <ul>
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/ellipse#">ellipse() method</a></li>
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/arc#">arc() method</a></li>
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/atan2">atan2() method</a></li>
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/clearRect">clearRect() method</a></li>
                <li><a href="https://developer.mozilla.org/en-US/docs/Web/API/Window/cancelAnimationFrame">cancelAnimationFrame() Method</a></li>
            </ul>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>
</html>
