<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <style>
        body {
            font-family:  'Montserrat', sans-serif;
            background-color: #FFFDD0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Conway's Game of Life</h1>
    <label for="gridSizeSlider">Grid Size:</label>
    <input type="range" id="gridSizeSlider" min="10" max="80" value="50">
    <span id="gridSizeValue">20</span> <!--Displays the current side of the grid-->

    <button id="startButton">Start</button>
    <button id="stopButton">Stop</button>
    <button id="resetButton">Reset</button>
    <button id="nextButton">Next</button>

    <div id="grid"></div>

    <script src="JS/script.js"></script>

</body>
</html>
